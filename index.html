<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#111111">
    <title>Menú</title>

    <link rel="stylesheet" href="css/style.css">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Fuente -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
</head>

<body>

    <a href="#" class="back-to-top" aria-label="Volver arriba">↑</a>

    <!-- HEADER -->
    <header class="header">
        <div class="logo-container">
            <h1 id="rest-nombre"></h1>
            <p id="rest-lema"></p>
        </div>
    </header>

    <!-- BANNER -->
    <section class="banner">
        <img src="img/banner.webp" alt="Banner del restaurante">
    </section>

    <!-- FRASE -->
    <div class="frase-espera">
        <p id="frase-espera"></p>
    </div>

    <!-- NAVEGACIÓN -->
    <div class="menu-nav-wrapper">
        <nav class="menu-nav" id="menu-nav"></nav>
    </div>

    <!-- EL MENÚ SE DIBUJA AQUÍ DESDE js/menu-data.js -->
    <main id="menu-body"></main>

    <!-- FOOTER -->
    <footer id="footer-info"></footer>

    <!-- BARRA DEL PEDIDO -->
    <div class="cart-bar" id="cart-bar" role="button" tabindex="0">
        <div class="cart-bar-left">
            <i class="fas fa-receipt"></i>
            <span id="cart-count">0 platos</span>
        </div>
        <div class="cart-bar-right">
            <span id="cart-total">$0.00</span>
            <span class="cart-bar-cta">Ver pedido <i class="fas fa-chevron-right"></i></span>
        </div>
    </div>

    <!-- MODAL DEL PEDIDO -->
    <div class="cart-overlay" id="cart-modal">
        <div class="cart-panel">
            <div class="cart-head">
                <h2><i class="fas fa-receipt"></i> Tu pedido</h2>
                <button class="cart-close" id="cart-close" aria-label="Cerrar">✕</button>
            </div>

            <div class="cart-scroll">
                <div id="cart-items"></div>
                <div id="cart-sugerencias"></div>

                <label class="campo">
                    <span>Nota para la cocina <em>(opcional)</em></span>
                    <textarea id="pedido-nota" rows="2" placeholder="Ej: sin ensalada, término medio…"></textarea>
                </label>
            </div>

            <div class="cart-foot">
                <div class="cart-foot-total">
                    <span>Total</span>
                    <strong id="cart-modal-total">$0.00</strong>
                </div>
                <button class="btn-confirmar" id="cart-confirmar">
                    <i class="fas fa-bell-concierge"></i> Listo, llamar al mesero
                </button>
            </div>
        </div>
    </div>

    <!-- COMANDA: lo que el mesero lee en la mesa -->
    <div class="comanda-overlay" id="comanda-modal">
        <div class="comanda-wrap">
            <p class="comanda-aviso"><i class="fas fa-hand-point-down"></i> Muéstrale esta pantalla al mesero</p>

            <div class="comanda-papel">
                <div id="comanda-contenido"></div>
            </div>

            <div class="comanda-acciones">
                <a class="btn-wa" id="comanda-whatsapp" target="_blank" rel="noopener">
                    <i class="fab fa-whatsapp"></i> Enviar por WhatsApp
                </a>
                <button class="btn-cerrar-comanda" id="comanda-close">Seguir viendo el menú</button>
            </div>
        </div>
    </div>

    <!-- TRACKER DE PEDIDO -->
    <div id="order-tracker" class="order-tracker" style="display:none">
        <div class="tracker-live">
            <span class="tracker-live-dot"></span>
            <span>En preparación</span>
        </div>
        <div class="tracker-status">
            <i id="order-status-icon" class="fas fa-check-circle"></i>
            <span id="order-status-text">Pedido recibido</span>
        </div>
        <div class="tracker-dots">
            <span class="tracker-dot active"></span>
            <span class="tracker-dot"></span>
            <span class="tracker-dot"></span>
            <span class="tracker-dot"></span>
            <span class="tracker-dot"></span>
            <span class="tracker-dot"></span>
        </div>
    </div>

    <!-- BOTÓN JUEGOS -->
    <button class="games-float-btn" onclick="openGamesHub()" aria-label="Juegos"><i class="fas fa-gamepad"></i></button>

    <!-- MODAL JUEGOS -->
    <div id="games-modal" class="games-overlay">
        <div class="games-container">
            <button class="games-close-btn" onclick="closeGamesHub()">✕</button>

            <!-- HUB -->
            <div id="games-hub">
                <div class="games-hub-header">
                    <h2><i class="fas fa-gamepad"></i> Juegos</h2>
                    <p>Mientras esperas tu pedido</p>
                </div>
                <div class="games-hub-grid">
                    <button class="game-option-btn" onclick="startGame('memory')">
                        <span class="game-icon"><i class="fas fa-clone"></i></span>
                        <span class="game-name">Memoria</span>
                    </button>
                    <button class="game-option-btn" onclick="startGame('ruleta')">
                        <span class="game-icon"><i class="fas fa-sync-alt"></i></span>
                        <span class="game-name">Ruleta</span>
                    </button>
                    <button class="game-option-btn" onclick="startGame('puzzle')">
                        <span class="game-icon"><i class="fas fa-puzzle-piece"></i></span>
                        <span class="game-name">Rompecabezas</span>
                    </button>
                </div>
            </div>

            <!-- MEMORIA -->
            <div id="game-memory" style="display:none">
                <div class="game-header">
                    <button class="back-btn" onclick="backToHub()">← Volver</button>
                    <h3><i class="fas fa-clone"></i> Memoria</h3>
                </div>
                <div class="game-stats">
                    <span>Movimientos: <strong id="memory-moves">0</strong></span>
                    <span>Tiempo: <strong id="memory-time">0s</strong></span>
                </div>
                <div id="memory-board" class="memory-board"></div>
                <button class="game-btn" onclick="startMemory()">Reiniciar</button>
            </div>

            <!-- RULETA -->
            <div id="game-ruleta" style="display:none">
                <div class="game-header">
                    <button class="back-btn" onclick="backToHub()">← Volver</button>
                    <h3><i class="fas fa-sync-alt"></i> ¿Qué pido hoy?</h3>
                </div>
                <div class="ruleta-wrapper">
                    <div class="ruleta-pointer">▼</div>
                    <canvas id="ruleta-canvas" width="260" height="260"></canvas>
                </div>
                <div id="ruleta-result" class="ruleta-result"></div>
                <button class="game-btn" onclick="spinRuleta()">¡Girar!</button>
            </div>

            <!-- ROMPECABEZAS -->
            <div id="game-puzzle" style="display:none">
                <div class="game-header">
                    <button class="back-btn" onclick="backToHub()">← Volver</button>
                    <h3><i class="fas fa-puzzle-piece"></i> Rompecabezas</h3>
                </div>
                <div class="game-stats">
                    <span>Movimientos: <strong id="puzzle-moves">0</strong></span>
                </div>
                <div id="puzzle-board" class="puzzle-board"></div>
                <button class="game-btn" onclick="initPuzzle()">Reiniciar</button>
            </div>
        </div>
    </div>

    <script src="js/menu-data.js"></script>
    <script src="js/store.js"></script>
    <script src="js/app.js"></script>
    <script src="js/games.js"></script>
    <script src="js/tracker.js"></script>

</body>

</html>
