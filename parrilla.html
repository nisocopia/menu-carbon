<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0d0d0d">
    <meta name="robots" content="noindex, nofollow">

    <title>Parrilla</title>

    <link rel="icon" type="image/png" href="img/favicon.png">
    <link rel="apple-touch-icon" href="img/icono-180.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Parrilla">

    <link rel="stylesheet" href="css/fuentes.css?v=202608042358">
    <link rel="stylesheet" href="css/iconos.css?v=202608042358">
    <link rel="stylesheet" href="css/servicio.css?v=202608042358">
</head>

<body class="srv-body estacion">

    <!-- ENTRAR -->
    <div class="srv-lock" id="lock">
        <div class="srv-lock-box">
            <div class="srv-lock-icon"><i class="fas fa-fire"></i></div>
            <h1>Parrilla</h1>
            <p id="lock-msg">Entra con la cuenta del asador</p>
            <input type="email" id="lock-correo" placeholder="Correo" autocomplete="username">
            <input type="password" id="lock-clave" placeholder="Clave" autocomplete="current-password">
            <button id="lock-entrar">Entrar</button>
            <p class="srv-lock-error" id="lock-error"></p>
        </div>
    </div>

    <header class="srv-top">
        <h1><i class="fas fa-fire"></i> Parrilla</h1>
        <div class="srv-red" id="red"></div>
    </header>

    <div class="srv-alarma" id="alarma" hidden></div>

    <!-- Sale cuando entra una cuenta que puede mirar esta pantalla pero no tocarla -->
    <div class="srv-solover" id="solover" hidden></div>

    <button class="srv-sonido" id="sin-sonido" hidden>
        <i class="fas fa-volume-xmark"></i>
        Toca aquí para activar el aviso sonoro
    </button>

    <!-- Las tarjetas: una por pedido, la más vieja primero -->
    <main class="tablero" id="tablero"></main>

    <!-- Lo que el asador ya sacó, plegado abajo -->
    <details class="sacadas" id="sacadas-caja">
        <summary><span id="sacadas-n">0</span> <span id="sacadas-txt">ya sacadas de la parrilla</span></summary>
        <div id="sacadas"></div>
    </details>

    <nav class="srv-links">
        <a href="comanda.html"><i class="fas fa-pen-to-square"></i> Tomar pedido</a>
        <a href="cocina.html"><i class="fas fa-kitchen-set"></i> Cocina</a>
        <button class="srv-salir" id="btn-probar-sonido"><i class="fas fa-volume-high"></i> Probar sonido</button>
        <button class="srv-salir" id="btn-salir"><i class="fas fa-right-from-bracket"></i> Salir</button>
    </nav>

    <div class="srv-toast" id="toast"></div>

    <script src="js/menu-data.js?v=202608042358"></script>
    <script src="js/sync.js?v=202608042358"></script>
    <script src="js/store.js?v=202608042358"></script>
    <script src="js/servicio.js?v=202608042358"></script>
    <script src="js/estacion.js?v=202608042358"></script>
    <script>iniciarEstacion('asador');</script>

</body>

</html>
