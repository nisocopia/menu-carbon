<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0d0d0d">
    <meta name="robots" content="noindex, nofollow">

    <title>Cocina</title>

    <!-- Cada pantalla es su propia aplicación: instalar "Cocina" tiene
         que abrir la cocina, no el menú del comensal. Por eso hay un
         manifiesto por pantalla y no uno solo para todo el sitio. -->
    <link rel="manifest" href="manifest-cocina.json">

    <link rel="icon" type="image/png" href="img/favicon.png">
    <link rel="apple-touch-icon" href="img/app/cocina-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Cocina">

    <link rel="stylesheet" href="css/fuentes.css?v=202608091310">
    <link rel="stylesheet" href="css/iconos.css?v=202608091310">
    <link rel="stylesheet" href="css/servicio.css?v=202608091310">
</head>

<body class="srv-body estacion">

    <!-- ENTRAR -->
    <div class="srv-lock" id="lock">
        <div class="srv-lock-box">
            <div class="srv-lock-icon"><i class="fas fa-kitchen-set"></i></div>
            <h1>Cocina</h1>
            <p id="lock-msg">Entra con la cuenta de la cocina</p>
            <input type="email" id="lock-correo" placeholder="Correo" autocomplete="username">
            <input type="password" id="lock-clave" placeholder="Clave" autocomplete="current-password">
            <button id="lock-entrar">Entrar</button>
            <p class="srv-lock-error" id="lock-error"></p>
        </div>
    </div>

    <header class="srv-top">
        <h1><i class="fas fa-kitchen-set"></i> Cocina</h1>
        <!-- Llamar al salon sin salir de la cocina. Va aqui, junto al
             punto de la conexion, para que este SIEMPRE: en las tarjetas,
             un tablero vacio se quedaba sin poder pedir cubiertos. -->
        <div class="srv-llamadas" id="llamar" hidden></div>

        <div class="srv-red" id="red"></div>
    </header>

    <div class="srv-alarma" id="alarma" hidden></div>

    <!-- Sale cuando entra una cuenta que puede mirar esta pantalla pero no tocarla -->
    <div class="srv-solover" id="solover" hidden></div>

    <button class="srv-sonido" id="sin-sonido" hidden>
        <i class="fas fa-volume-xmark"></i>
        Toca aquí para activar el aviso sonoro
    </button>

    <!-- Cuántas porciones de arroz están pedidas y todavía no han salido.
         No es una estimación: se cuenta. Sube cuando entra un pedido
         grande —que es cuando hay que poner la olla— y baja cuando se
         marca entregado. -->
    <div class="srv-arroz" id="arroz" hidden></div>

    <!-- Esta pantalla también la lee el que sirve los platos: por eso la
         mesa y los cubiertos van en grande, y no hay que tocar nada
         para verlos. -->
    <main class="tablero" id="tablero"></main>

    <details class="sacadas" id="sacadas-caja" hidden>
        <summary><span id="sacadas-n">0</span> <span id="sacadas-txt">entregadas</span></summary>
        <div id="sacadas"></div>
    </details>

    <!-- Que el celular avise aunque esté guardado. Se pide desde un
         toque a propósito: una página que pregunta sola al abrirse
         recibe un "no" automático en Chrome, y ese "no" ya no se puede
         deshacer sin ir a los ajustes del sistema. -->
    <button class="srv-avisos" id="btn-avisos" hidden></button>

    <!-- Solo sale cuando el navegador de verdad puede instalarla. Un
         botón que a veces no hace nada es peor que no tenerlo. -->
    <button class="srv-instalar" id="btn-instalar" hidden>
        <i class="fas fa-download"></i>
        Instalar la cocina en este aparato
        <span>Se abre de un toque y no se pierde entre las pestañas</span>
    </button>

    <nav class="srv-links">
        <a href="comanda.html"><i class="fas fa-pen-to-square"></i> Tomar pedido</a>
        <a href="servir.html"><i class="fas fa-utensils"></i> Servir</a>
        <a href="parrilla.html"><i class="fas fa-fire"></i> Parrilla</a>
        <button class="srv-salir" id="btn-probar-sonido"><i class="fas fa-volume-high"></i> Probar sonido</button>
        <button class="srv-salir" id="btn-salir"><i class="fas fa-right-from-bracket"></i> Salir</button>
    </nav>

    <div class="srv-toast" id="toast"></div>

    <script src="js/menu-data.js?v=202608091310"></script>
    <script src="js/sync.js?v=202608091310"></script>
    <script src="js/store.js?v=202608091310"></script>
    <script src="js/servicio.js?v=202608091310"></script>
    <script src="js/estacion.js?v=202608091310"></script>
    <script src="js/pwa.js?v=202608091310"></script>
    <script src="js/aviso.js?v=202608091310"></script>
    <script>iniciarEstacion('cocina');</script>

</body>

</html>
